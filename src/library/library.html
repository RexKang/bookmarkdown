<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>BookmarkDown 库</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0d12; color: #f2f4f8;
         font: 14px/1.7 system-ui, "Microsoft YaHei", sans-serif;
         display: flex; justify-content: center; padding: 44px 20px; }
  .card { width: min(680px, 100%); }
  h1 { display: flex; align-items: center; gap: 10px; font-size: 20px; margin: 0 0 6px; }
  h1 i { width: 8px; height: 24px; border-radius: 3px; background: #e50914; }
  .tag { font-size: 11px; color: #96a0b2; border: 1px solid #2a3140; border-radius: 999px; padding: 2px 10px; }
  section { margin-top: 22px; background: #12161f; border: 1px solid #232b3a; border-radius: 12px; padding: 18px 20px; }
  h2 { margin: 0 0 8px; font-size: 15px; }
  p { color: #96a0b2; margin: 0 0 12px; }
  button { border: 0; border-radius: 7px; padding: 9px 14px; background: #2965cc; color: #fff;
           font: inherit; cursor: pointer; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; color: #cfd6e2; margin: 6px 0; }
  .row b { color: #fff; }
  .hint { color: #6d7686; font-size: 12px; }
  .kbd { border: 1px solid #2a3140; border-radius: 5px; padding: 0 6px; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1><i></i>BookmarkDown 库 <span class="tag">v0.1.0 开发版</span></h1>
    <p class="hint">当前为最小可用库页（选目录 / 解锁 / 状态）；完整海报墙界面按定稿设计稿装配中。</p>

    <section id="onboard">
      <h2>选择库目录</h2>
      <p>库 = 一个普通文件夹：每条收藏写成 Markdown 条目 + 封面快照，可直接用 Obsidian 打开、用 git 管理。</p>
      <button id="pick">选择库目录…</button>
    </section>

    <section id="locked" hidden>
      <h2>库目录需要授权</h2>
      <p>浏览器重启后需要一次点击完成授权（选「每次访问都允许」后不再询问）。</p>
      <button id="unlock">解锁库</button>
    </section>

    <section id="ready" hidden>
      <h2>库已就绪</h2>
      <div class="row">目录：<b id="libName"></b></div>
      <div class="row">合集：<span id="files">…</span></div>
      <p class="hint">在任意网页右键 →「收藏到 BookmarkDown」即可收藏（页面 / 图片 / 链接）。</p>
    </section>
  </div>
  <script type="module" src="library.js"></script>
</body>
</html>
